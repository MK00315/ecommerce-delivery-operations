name: Project checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install the pinned environment
        run: python -m pip install -r requirements.txt
      - name: Prepare the original version-2 source
        run: python scripts/download_dataset.py
      - name: Rebuild and reconcile the SQL foundation
        run: python delivery_pipeline.py
      - name: Verify the bundled dashboard
        run: python run_delivery_dashboard.py --check
      - name: Check JavaScript syntax
        run: node --check dashboard/assets/app.js
      - name: Run the project tests
        run: python -m pytest tests -q --junitxml=reports/ci/qa.xml
